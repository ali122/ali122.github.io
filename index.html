<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB Travels — moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://abtravels.github.io/">
<script>
  (function () {
    var base = "https://abtravels.github.io";
    var p = location.pathname || "/";
    var s = location.search || "";
    var h = location.hash || "";
    var target = p.indexOf("/travel-office-hisab/company") === 0
      ? base + "/" + s + h
      : base + p + s + h;
    location.replace(target);
  })();
</script>
<style>
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#0b2239;color:#dbe7f0;display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
  a{color:#8fe3e2}
  p{max-width:40ch;line-height:1.6}
</style>
</head>
<body>
  <div>
    <p>AB Travels has moved to <a href="https://abtravels.github.io/">abtravels.github.io</a>.</p>
  </div>
</body>
</html>
